name: Docker image update

# Updates the version of PHP of the docker image once a day, submitting it as a pull request with the
# token of the GitHub App of the daily build (see autobuild.yml): see tests/update_docker.sh.

on:
  schedule:
    - cron: '47 2 * * *'

permissions:
  contents: read

jobs:
  update:
    # Until the app is set up.
    if: vars.AUTOBUILD_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Get a token of the app
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOBUILD_APP_ID }}
          private-key: ${{ secrets.AUTOBUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: MadelineProto

      - name: Get the user of the app
        id: user
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          echo "name=$SLUG[bot]" >> "$GITHUB_OUTPUT"
          echo "email=$(gh api "/users/$SLUG%5Bbot%5D" --jq .id)+$SLUG[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Update PHP
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GIT_NAME: ${{ steps.user.outputs.name }}
          GIT_EMAIL: ${{ steps.user.outputs.email }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tests/update_docker.sh
