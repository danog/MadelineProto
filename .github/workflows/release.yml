name: Release

# When a release is published, its notes are generated (see tests/release_notes.sh); once it's fully released
# (not a pre-release anymore), its changelog is sent to Telegram (see tests/announce_release.php).
# Both only once.

on:
  release:
    types: [published, released]
  # The CI releases the tags (they stop being pre-releases) with the token of its job, whose events don't run
  # workflows: it runs this one instead.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release
        required: true

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    # With pipefail, unlike the default shell ("bash -e"): a command failing in a pipeline fails the step.
    shell: bash

jobs:
  release:
    name: release
    timeout-minutes: 30
    # The secrets of the job are the ones of this environment, not of the repository. No deployment is recorded.
    environment:
      name: release
      deployment: false
    runs-on: ubuntu-24.04
    permissions:
      # To write the notes of the release.
      contents: write
    container:
      image: danog/madelineproto:next
      # The image runs as an unprivileged user by default: the steps install packages, and the checkout and the
      # caches are written to directories of the runner, mounted in the container.
      options: --user root
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git jq
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags, for the layer of the previous release.
          fetch-depth: 0
      - name: Generate the release notes
        run: tests/test.sh release-notes "$TAG"
      - name: Send the phar to @madelineprotophar
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'released' }}
        env:
          PHAR_BOT_TOKEN: ${{ secrets.PHAR_BOT_TOKEN }}
        run: tests/send_phar.sh "$TAG"
      - name: Send the changelog to Telegram
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'released' }}
        env:
          PHAR_BOT_TOKEN: ${{ secrets.PHAR_BOT_TOKEN }}
        run: php tests/announce_release.php "$TAG"
