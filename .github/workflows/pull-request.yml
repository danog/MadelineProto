name: Pull request

# The jobs that need no secret, for pull requests (which don't get them, if from forks): the main branch and the tags
# run the whole CI, with the secrets (ci.yml). The logic lives in tests/test.sh, not here.

on:
  pull_request:

permissions:
  contents: read

env:
  # Cached between runs (see the cache steps).
  COMPOSER_CACHE_DIR: /github/home/composer-cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # With pipefail, unlike the default shell ("bash -e"): a command failing in a pipeline fails the step.
    shell: bash

jobs:
  cs:
    name: cs
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # The image of the main branch, pulled anonymously: without the secrets.
    container:
      image: danog/madelineproto:next
      # The image runs as an unprivileged user by default: the steps install packages, and the checkout and the
      # caches are written to directories of the runner, mounted in the container.
      options: --user root
    steps:
      # Before the checkout: without git, it downloads the sources without the repository.
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          command -v git > /dev/null || { apt-get update && apt-get install -y git; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages downloaded by composer, between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/composer-cache
          key: composer-${{ hashFiles('composer.json') }}-${{ github.run_id }}
          restore-keys: composer-
      - name: Check the code style and the generated docs
        env:
          # For the GitHub API, which only allows 60 unauthenticated requests per hour per IP.
          GITHUB_TOKEN: ${{ github.token }}
        run: tests/test.sh cs

  # Not in the container: it has no Node.js, the runner has.
  webui:
    name: webui
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test the web UI, and check that its committed bundle is up to date
        run: tests/webui.sh

  # The tests that don't need any secret, with each event loop driver of Revolt: ext-uv's (the default), PHP's own
  # (stream_select, without any extension, as on most installations), ext-ev's and ext-event's. In the test image of
  # the main branch (tests/dockerfiles/Dockerfile.test, which has their extensions): pull requests have no secrets to
  # push one of their own.
  test_light:
    name: test_light (${{ matrix.event-loop }})
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        event-loop: [uv, select, ev, event]
    container:
      image: danog/madelineproto:next-test
      # The image runs as an unprivileged user by default: the steps install packages, and the checkout and the
      # caches are written to directories of the runner, mounted in the container.
      options: --user root
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          command -v git > /dev/null || { apt-get update && apt-get install -y git; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages downloaded by composer, between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/composer-cache
          key: composer-${{ hashFiles('composer.json') }}-${{ github.run_id }}
          restore-keys: composer-
      - name: Run the light tests
        env:
          MADELINE_EVENT_LOOP: ${{ matrix.event-loop }}
        run: tests/test.sh phpunit-light

  handshake:
    name: handshake
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container:
      image: danog/madelineproto:next
      # The image runs as an unprivileged user by default: the steps install packages, and the checkout and the
      # caches are written to directories of the runner, mounted in the container.
      options: --user root
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          command -v git > /dev/null || { apt-get update && apt-get install -y git; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages downloaded by composer, between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/composer-cache
          key: composer-${{ hashFiles('composer.json') }}-${{ github.run_id }}
          restore-keys: composer-
      - name: Test the handshake
        run: tests/test.sh handshake
