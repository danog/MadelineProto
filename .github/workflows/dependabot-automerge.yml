name: Dependabot auto-merge

# Merges the pull requests of Dependabot once their checks (pull-request.yml) passed on their last commit: see
# tests/dependabot_merge.sh. The ruleset of the main branch requires no review nor status check, so GitHub's own
# auto-merge would merge them before their checks run.
#
# On workflow_run, this runs the workflow of the main branch, with its secrets: only the main branch is checked out,
# never the code of the pull request.

on:
  workflow_run:
    workflows:
      - Pull request
    types:
      - completed

permissions:
  contents: read

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'dependabot[bot]' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Merge the pull request
        env:
          # Of an admin: Dependabot updates workflows too, which the token of a job can't merge.
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: tests/dependabot_merge.sh
