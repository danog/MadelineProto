name: Release publish

# Publishes the draft of the next release (see release-draft.yml) as a pre-release once a day, tagging the main
# branch, whose CI then builds, tests and releases it: see tests/release_publish.sh. Only an existing draft, and
# only once the main branch is ready (its RELEASE constant set, its CI passed).
# Disabled until the RELEASE_DRAFT variable of the repository is set to true.

on:
  schedule:
    - cron: '47 17 * * *'
  # From the Actions tab, or with gh workflow run release-publish.yml.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Not while the draft is being updated.
  group: release-draft
  cancel-in-progress: false

jobs:
  publish:
    if: vars.RELEASE_DRAFT == 'true'
    runs-on: ubuntu-latest
    container: danog/madelineproto:next
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git jq
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v7
      - name: Publish the draft
        env:
          # Of an admin: the tag it creates must run the CI, which the events of the token of a job don't.
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: tests/test.sh release-publish
