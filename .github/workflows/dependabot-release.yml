name: Dependabot release

# Bumps the RELEASE constant for the pull requests of Dependabot once merged to the main branch, as the pull requests
# of others bump it themselves: see tests/dependabot_release.sh. The CI of the bump (cancelling the one of the merge)
# then releases it (prerelease.yml).

on:
  push:
    branches:
      - v8

permissions:
  contents: read

# One bump at a time: the next one sees the previous one.
concurrency:
  group: dependabot-release
  cancel-in-progress: false

defaults:
  run:
    # With pipefail, unlike the default shell ("bash -e"): a command failing in a pipeline fails the step.
    shell: bash

jobs:
  bump:
    name: bump
    timeout-minutes: 15
    # The secrets of the job are the ones of this environment, not of the repository. No deployment is recorded.
    environment:
      name: admin-token
      deployment: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pushed commit and its parent: the changes of the pull request.
          fetch-depth: 2
          # The script pushes with the token of an admin (gh auth setup-git), not with the one of the job.
          persist-credentials: false
      - name: Bump the RELEASE constant for a pull request of Dependabot
        env:
          # Of an admin, to push the bump to the main branch, and so that the push runs the CI (the events of the token
          # of a job don't).
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
        run: tests/dependabot_release.sh
