name: Release draft

# Keeps the draft of the next release up to date with what's pushed to the main branch (the version, the
# RELEASE constant, the notes): see tests/release_draft.sh. The release is published by hand, from the draft.
# Disabled until the RELEASE_DRAFT variable of the repository is set to true.

on:
  push:
    branches:
      - v8

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: true

jobs:
  draft:
    if: vars.RELEASE_DRAFT == 'true'
    runs-on: ubuntu-latest
    container: danog/madelineproto:next
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git jq
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          # The tags, for the last release.
          fetch-depth: 0
          token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
      - name: Update the draft
        env:
          # Of an admin, to push the RELEASE constant to the main branch.
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: tests/test.sh release-draft
