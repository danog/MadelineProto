name: CI

# The logic lives in tests/test.sh and tests/makephar.sh, not here: keep it that way, so that the CI
# can move to another provider.

# The main branch and the tags, with the secrets (the whole test suite and the build of the phar, which use the
# sessions of the accounts of the CI). The other branches are tested as pull requests, with the jobs that need no
# secret, in their own workflow (pull-request.yml), so that neither lists jobs it skips. A branch push running these
# jobs too would compete for the sessions and the build with the main branch (GitHub only keeps one waiting job per
# concurrency group, cancelling the others), and log in again with the authorizations of the accounts, which gets
# FLOOD_WAITs once many runs do it at once.
on:
  push:
    branches:
      - v8
    tags:
      - '*'

permissions:
  contents: read

env:
  # Cached between runs (see the cache steps).
  COMPOSER_CACHE_DIR: /github/home/composer-cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not the builds of tags, which release.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    # With pipefail, unlike the default shell ("bash -e"): a command failing in a pipeline fails the step.
    shell: bash

jobs:
  # The image the other jobs run in, rebuilt for every run: they wait for it, and pull the new one. Tagged by
  # tests/docker_image.sh: next for the main branch; the version for a tag (whose jobs run in it), then latest, the
  # major and the minor version once it's released (docker-release).
  docker:
    name: docker
    timeout-minutes: 60
    # The secrets of the job are the ones of this environment, not of the repository. No deployment is recorded.
    environment:
      name: ci
      deployment: false
    strategy:
      matrix:
        include:
          - image: ubuntu-24.04
            arch: amd64
          - image: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Not from the cache for the tags, which release.
          cache-binary: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Build and push the image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          # For the GitHub API, from which PIE downloads the extensions: 60 unauthenticated requests per hour per IP.
          GITHUB_TOKEN: ${{ github.token }}
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          ARCH: ${{ matrix.arch }}
        run: tests/docker_image.sh build "$ARCH"

  docker-merge:
    name: docker-merge
    timeout-minutes: 10
    # The secrets of the job are the ones of this environment, not of the repository. No deployment is recorded.
    environment:
      name: ci
      deployment: false
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push the multi-arch image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: tests/docker_image.sh merge

  cs:
    name: cs
    timeout-minutes: 30
    # The secrets of the job are the ones of this environment, not of the repository. No deployment is recorded.
    environment:
      name: ci
      deployment: false
    needs: docker-merge
    runs-on: ubuntu-24.04
    container:
      # The image of the version, for a tag.
      image: danog/madelineproto:${{ github.ref_type == 'tag' && github.ref_name || 'next' }}
      # The image runs as an unprivileged user by default: the steps install packages, and the checkout and the
      # caches are written to directories of the runner, mounted in the container.
      options: --user root
      # Pulled as the account of the image: anonymous pulls share the rate limit of Docker Hub with every
      # other user of the IP of the runner.
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      # Before the checkout: without git, it downloads the sources without the repository.
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          command -v git > /dev/null || { apt-get update && apt-get install -y git; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages downloaded by composer, between runs. Not for the tags, which release: a poisoned entry would end
      # up in the phar.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: /github/home/composer-cache
          key: composer-${{ hashFiles('composer.json') }}-${{ github.run_id }}
          restore-keys: composer-
      - name: Check the code style and the generated docs
        env:
          # For the GitHub API, which only allows 60 unauthenticated requests per hour per IP.
          GITHUB_TOKEN: ${{ github.token }}
        run: tests/test.sh cs

  # Not in the container: it has no Node.js, the runner has.
  webui:
    name: webui
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test the web UI, and check that its committed bundle is up to date
        run: tests/webui.sh

  # The whole test suite, with the secrets. Not for the tags: they're the commits of the main branch whose CI passed
  # (see tests/prerelease.sh), whose tests would only compete for the sessions with the ones of the main branch.
  test:
    name: test
    # The secrets of the job are the ones of this environment, not of the repository. No deployment is recorded.
    environment:
      name: ci
      deployment: false
    needs: docker-merge
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    container:
      # The test image (tests/dockerfiles/Dockerfile.test: the image plus what only the tests use).
      image: danog/madelineproto:${{ github.ref_type == 'tag' && github.ref_name || 'next' }}-test
      # The image runs as an unprivileged user by default: the steps install packages, and the checkout and the
      # caches are written to directories of the runner, mounted in the container.
      options: --user root
      # Pulled as the account of the image: anonymous pulls share the rate limit of Docker Hub with every
      # other user of the IP of the runner.
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    # Rather than the default 6 hours if a test hangs, holding the user sessions (the hourly build waits for them).
    timeout-minutes: 60
    # The user sessions (and the one of the bot) must not be used by two jobs at once.
    concurrency:
      group: telegram-user-sessions
      cancel-in-progress: false
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          command -v git > /dev/null || { apt-get update && apt-get install -y git; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages downloaded by composer, between runs. Not for the tags, which release: a poisoned entry would end
      # up in the phar.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: /github/home/composer-cache
          key: composer-${{ hashFiles('composer.json') }}-${{ github.run_id }}
          restore-keys: composer-
      - name: Run the tests
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          DEST: ${{ secrets.DEST }}
          # Only for the bot API: the bot logs in with BOT_SESSION_AUTH (see tests/ci_sessions.php).
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_SESSION_AUTH: ${{ secrets.BOT_SESSION_AUTH }}
          USER_SESSION_AUTH: ${{ secrets.USER_SESSION_AUTH }}
          PEER_USER_SESSION_AUTH: ${{ secrets.PEER_USER_SESSION_AUTH }}
        run: tests/test.sh phpunit

  # The tests that need no account, with the other event loop drivers of Revolt than ext-uv's (the default, tested
  # above): PHP's own (stream_select, without any extension, as on most installations), ext-ev's and ext-event's, whose
  # extensions are only in the test image.
  test_light:
    name: test_light (${{ matrix.event-loop }})
    # The secrets of the job are the ones of this environment, not of the repository. No deployment is recorded.
    environment:
      name: ci
      deployment: false
    needs: docker-merge
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        event-loop: [select, ev, event]
    container:
      # The test image (tests/dockerfiles/Dockerfile.test: the image plus what only the tests use).
      image: danog/madelineproto:${{ github.ref_type == 'tag' && github.ref_name || 'next' }}-test
      # The image runs as an unprivileged user by default: the steps install packages, and the checkout and the
      # caches are written to directories of the runner, mounted in the container.
      options: --user root
      # Pulled as the account of the image: anonymous pulls share the rate limit of Docker Hub with every
      # other user of the IP of the runner.
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    timeout-minutes: 60
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          command -v git > /dev/null || { apt-get update && apt-get install -y git; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages downloaded by composer, between runs. Not for the tags, which release: a poisoned entry would end
      # up in the phar.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: /github/home/composer-cache
          key: composer-${{ hashFiles('composer.json') }}-${{ github.run_id }}
          restore-keys: composer-
      - name: Run the light tests
        env:
          MADELINE_EVENT_LOOP: ${{ matrix.event-loop }}
        run: tests/test.sh phpunit-light

  handshake:
    name: handshake
    timeout-minutes: 30
    # The secrets of the job are the ones of this environment, not of the repository. No deployment is recorded.
    environment:
      name: ci
      deployment: false
    needs: docker-merge
    runs-on: ubuntu-24.04
    container:
      # The image of the version, for a tag.
      image: danog/madelineproto:${{ github.ref_type == 'tag' && github.ref_name || 'next' }}
      # The image runs as an unprivileged user by default: the steps install packages, and the checkout and the
      # caches are written to directories of the runner, mounted in the container.
      options: --user root
      # Pulled as the account of the image: anonymous pulls share the rate limit of Docker Hub with every
      # other user of the IP of the runner.
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          command -v git > /dev/null || { apt-get update && apt-get install -y git; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages downloaded by composer, between runs. Not for the tags, which release: a poisoned entry would end
      # up in the phar.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: /github/home/composer-cache
          key: composer-${{ hashFiles('composer.json') }}-${{ github.run_id }}
          restore-keys: composer-
      - name: Test the handshake
        run: tests/test.sh handshake

  build:
    name: build
    timeout-minutes: 60
    # The secrets of the job are the ones of this environment, not of the repository. No deployment is recorded.
    environment:
      name: ci
      deployment: false
    # At once with the other tests: the release job publishes the phar once all of them passed.
    needs: docker-merge
    runs-on: ubuntu-24.04
    # It tests the phar with the session of authorization 0 of the bot (see tests/session_tests.sh), which two
    # builds must not use at once.
    concurrency:
      group: telegram-phar-build
      cancel-in-progress: false
    container:
      # The image of the version, for a tag.
      image: danog/madelineproto:${{ github.ref_type == 'tag' && github.ref_name || 'next' }}
      # The image runs as an unprivileged user by default: the steps install packages, and the checkout and the
      # caches are written to directories of the runner, mounted in the container.
      options: --user root
      # Pulled as the account of the image: anonymous pulls share the rate limit of Docker Hub with every
      # other user of the IP of the runner.
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    services:
      mariadb:
        image: mariadb:13@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
        env:
          MARIADB_DATABASE: MadelineProtoDb
          MARIADB_USER: MadelineProtoUser
          MARIADB_PASSWORD: test
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_DB: MadelineProtoDb
          POSTGRES_USER: MadelineProtoUser
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U MadelineProtoUser -d MadelineProtoDb"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          command -v git > /dev/null || { apt-get update && apt-get install -y git; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages downloaded by composer, between runs. Not for the tags, which release: a poisoned entry would end
      # up in the phar.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: /github/home/composer-cache
          key: composer-${{ hashFiles('composer.json') }}-${{ github.run_id }}
          restore-keys: composer-
      - name: Build and test the phar
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          DEST: ${{ secrets.DEST }}
          BOT_SESSION_AUTH: ${{ secrets.BOT_SESSION_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Empty unless building a tag, like Woodpecker's.
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_DIR: ${{ github.workspace }}/release-files
        run: /bin/bash -e tests/makephar.sh
      - name: Keep the files of the release
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files
          if-no-files-found: error

  release:
    name: release
    timeout-minutes: 30
    # Once every test passed (the test job is skipped for tags). Skipped for the main branch: it needs the results of
    # this run, so it can't be in a workflow of its own.
    needs: [cs, webui, test, test_light, handshake, build]
    if: ${{ !cancelled() && !failure() && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      # To upload the phar to the release of a tag.
      contents: write
      # To run release.yml.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Release the phar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tests/release_phar.sh "${GITHUB_REF_NAME}" release-files
      # Released with the token of the job: its events don't run workflows, so run it, and wait for it, so that the
      # release fails if it fails.
      - name: Announce the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tests/release_dispatch.sh "${GITHUB_REF_NAME}"

  # latest, and the major and minor versions, only once released.
  docker-release:
    name: docker-release
    timeout-minutes: 10
    # The secrets of the job are the ones of this environment, not of the repository. No deployment is recorded.
    environment:
      name: ci
      deployment: false
    needs: release
    # The implicit success() skips a job when any job it depends on, even indirectly, was skipped: the test job
    # always is for tags, so latest was never moved.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point latest to the image of the release
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          CI_COMMIT_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: tests/docker_image.sh release
