name: CI

# The logic lives in tests/test.sh and tests/makephar.sh, not here: keep it that way, so that the CI
# can move to another provider.

on:
  push:
    # Not the branch of the pull requests of the daily build (see autobuild.yml): tested as pull requests, rather than
    # with the whole test suite, whose job (waiting for the user sessions, held by the daily build that pushed it)
    # would cancel the one of the main branch, GitHub only keeping one waiting job per concurrency group.
    branches-ignore:
      - autobuild
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not the builds of tags, which release.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # The image the other jobs run in, rebuilt when the main branch or a tag is pushed: they wait for it, and
  # pull the new one.
  docker:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/v8' || github.ref_type == 'tag')
    strategy:
      matrix:
        include:
          - image: ubuntu-latest
            arch: amd64
          - image: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push the image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          # Without attestations: a plain image (rather than an index), for docker manifest in docker-merge.
          docker buildx build --platform "linux/$ARCH" . -f tests/dockerfiles/Dockerfile -t "danog/madelineproto:next-debian-$ARCH" --cache-from "danog/madelineproto:next-debian-$ARCH" --cache-to type=inline --provenance=false --sbom=false --push

  docker-merge:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Push the multi-arch image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        # With docker manifest, which reads the images as the account logged in: docker buildx imagetools create
        # read some of them anonymously, failing with the rate limit of anonymous pulls (429).
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          for tag in debian next latest; do
            docker manifest create "danog/madelineproto:$tag" danog/madelineproto:next-debian-{amd,arm}64
            docker manifest push "danog/madelineproto:$tag"
          done

  cs:
    needs: docker-merge
    # Also when the image wasn't rebuilt.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: danog/madelineproto:next
      # Pulled as the account of the image (see the test job), except for pull requests, which may come from forks,
      # without the secrets: empty credentials would fail the job, and so does a null value (Unexpected value ''),
      # so they get no credentials at all.
      credentials: ${{ github.event_name == 'push' && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(secrets.DOCKER_USERNAME), toJSON(secrets.DOCKER_PASSWORD))) || fromJSON('{}') }}
    steps:
      # Before the checkout: without git, it downloads the sources without the repository.
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Check the code style and the generated docs
        env:
          # For the GitHub API, which only allows 60 unauthenticated requests per hour per IP.
          GITHUB_TOKEN: ${{ github.token }}
        run: tests/test.sh cs

  # Not in the container: it has no Node.js, the runner has.
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the web UI, and check that its committed bundle is up to date
        run: tests/webui.sh

  # The whole test suite, with the secrets: for pushes.
  test:
    needs: docker-merge
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    container:
      image: danog/madelineproto:next
      # Pulled as the account of the image: anonymous pulls share the rate limit of Docker Hub with every
      # other user of the IP of the runner.
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    # Rather than the default 6 hours if a test hangs, holding the user sessions (the daily build waits for them).
    timeout-minutes: 60
    # The user sessions (and the one of the bot) must not be used by two jobs at once.
    concurrency:
      group: telegram-user-sessions
      cancel-in-progress: false
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Run the tests
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          DEST: ${{ secrets.DEST }}
          # Only for the bot API: the bot logs in with BOT_SESSION_AUTH (see tests/ci_sessions.php).
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_SESSION_AUTH: ${{ secrets.BOT_SESSION_AUTH }}
          USER_SESSION_AUTH: ${{ secrets.USER_SESSION_AUTH }}
          PEER_USER_SESSION_AUTH: ${{ secrets.PEER_USER_SESSION_AUTH }}
        run: tests/test.sh phpunit

  # The tests that don't need any secret, for pull requests (which don't get them, if from forks).
  test_light:
    needs: docker-merge
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    container: danog/madelineproto:next
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Run the light tests
        run: tests/test.sh phpunit-light

  handshake:
    needs: docker-merge
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: danog/madelineproto:next
      # Pulled as the account of the image (see the test job), except for pull requests, which may come from forks,
      # without the secrets: empty credentials would fail the job, and so does a null value (Unexpected value ''),
      # so they get no credentials at all.
      credentials: ${{ github.event_name == 'push' && fromJSON(format('{{"username":{0},"password":{1}}}', toJSON(secrets.DOCKER_USERNAME), toJSON(secrets.DOCKER_PASSWORD))) || fromJSON('{}') }}
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Test the handshake
        run: tests/test.sh handshake

  build:
    needs: [cs, webui, test, test_light, handshake]
    # Either test or test_light is skipped. Not for pull requests: it releases the tags, the secrets it
    # tests with are not given to pull requests from forks, and the push of a branch of this
    # repository already builds it.
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # It tests the phar with the session of the bot, like the test job.
    concurrency:
      group: telegram-user-sessions
      cancel-in-progress: false
    container:
      image: danog/madelineproto:next
      # Pulled as the account of the image: anonymous pulls share the rate limit of Docker Hub with every
      # other user of the IP of the runner.
      credentials:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    permissions:
      # To upload the phar to the release of a tag.
      contents: write
      # To run release.yml.
      actions: write
    services:
      mariadb:
        image: mariadb
        env:
          MARIADB_DATABASE: MadelineProtoDb
          MARIADB_USER: MadelineProtoUser
          MARIADB_PASSWORD: test
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres
        env:
          POSTGRES_DB: MadelineProtoDb
          POSTGRES_USER: MadelineProtoUser
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U MadelineProtoUser -d MadelineProtoDb"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Build, test and release the phar
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          DEST: ${{ secrets.DEST }}
          BOT_SESSION_AUTH: ${{ secrets.BOT_SESSION_AUTH }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Empty unless building a tag, like Woodpecker's.
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: /bin/bash -e tests/makephar.sh
      # Released by makephar.sh, with the token of the job: its events don't run workflows, so run it, and wait for
      # it, so that the release fails if it fails.
      - name: Announce the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: tests/release_dispatch.sh "${{ github.ref_name }}"
