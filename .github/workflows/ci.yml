name: CI

# The logic lives in tests/test.sh and tests/makephar.sh, not here: keep it that way, so that the CI
# can move to another provider.

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not the builds of tags, which release.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # The image the other jobs run in, rebuilt when the main branch or a tag is pushed: they wait for it, and
  # pull the new one.
  docker:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/v8' || github.ref_type == 'tag')
    strategy:
      matrix:
        include:
          - image: ubuntu-latest
            arch: amd64
          - image: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push the image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker buildx build --platform "linux/$ARCH" . -f tests/dockerfiles/Dockerfile -t "danog/madelineproto:next-debian-$ARCH" --cache-from "danog/madelineproto:next-debian-$ARCH" --cache-to type=inline --push

  docker-merge:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Push the multi-arch image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          for tag in debian next latest; do
            docker buildx imagetools create -t "danog/madelineproto:$tag" danog/madelineproto:next-debian-{arm,amd}64
          done

  cs:
    needs: docker-merge
    # Also when the image wasn't rebuilt.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container: danog/madelineproto:next
    steps:
      # Before the checkout: without git, it downloads the sources without the repository.
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Check the code style and the generated docs
        env:
          # For the GitHub API, which only allows 60 unauthenticated requests per hour per IP.
          GITHUB_TOKEN: ${{ github.token }}
        run: tests/test.sh cs

  # The whole test suite, with the secrets: for pushes.
  test:
    needs: docker-merge
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    container: danog/madelineproto:next
    # The user sessions must not be used by two jobs at once.
    concurrency:
      group: telegram-user-sessions
      cancel-in-progress: false
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Run the tests
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          DEST: ${{ secrets.DEST }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          USER_SESSION_AUTH: ${{ secrets.USER_SESSION_AUTH }}
          PEER_USER_SESSION_AUTH: ${{ secrets.PEER_USER_SESSION_AUTH }}
        run: tests/test.sh phpunit

  # The tests that don't need any secret, for pull requests (which don't get them, if from forks).
  test_light:
    needs: docker-merge
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    container: danog/madelineproto:next
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Run the light tests
        run: tests/test.sh phpunit-light

  handshake:
    needs: docker-merge
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container: danog/madelineproto:next
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Test the handshake
        run: tests/test.sh handshake

  build:
    needs: [cs, test, test_light, handshake]
    # Either test or test_light is skipped. Not for pull requests: it releases the tags, the secrets it
    # tests with are not given to pull requests from forks, and the push of a branch of this
    # repository already builds it.
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    container: danog/madelineproto:next
    permissions:
      # To upload the phar to the release of a tag.
      contents: write
    services:
      mariadb:
        image: mariadb
        env:
          MARIADB_DATABASE: MadelineProtoDb
          MARIADB_USER: MadelineProtoUser
          MARIADB_PASSWORD: test
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres
        env:
          POSTGRES_DB: MadelineProtoDb
          POSTGRES_USER: MadelineProtoUser
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U MadelineProtoUser -d MadelineProtoDb"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Install git
        # The checkout belongs to the user of the runner, not to the one of the container: trust it.
        run: |
          apt-get update && apt-get install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Build, test and release the phar
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          DEST: ${{ secrets.DEST }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PHAR_BOT_TOKEN: ${{ secrets.PHAR_BOT_TOKEN }}
          # Empty unless building a tag, like Woodpecker's.
          CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: /bin/bash -e tests/makephar.sh
