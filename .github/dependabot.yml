# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Labelled for pr-labels.yml, which requires a release label on every pull request.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "release:internal"
  # The tools of the code checks (bamarni/composer-bin-plugin).
  - package-ecosystem: "composer"
    directory: "/vendor-bin/check"
    schedule:
      interval: "weekly"
    labels:
      - "release:internal"
  # The actions of the workflows, pinned by commit with their version in a comment, which Dependabot updates too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "release:internal"
  - package-ecosystem: "npm"
    directory: "/webui"
    schedule:
      interval: "weekly"
    labels:
      - "release:internal"
    ignore:
      # Solid 2 is a rewrite of its API, and solid-transition-group (the latest, 0.3.0) needs solid-js ^1.6.12:
      # the bump to 2.0.3 broke npm ci (ERESOLVE), and with it the webui job of the CI and the hourly build.
      - dependency-name: "solid-js"
        update-types: ["version-update:semver-major"]
