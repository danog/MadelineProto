# The sections of the release notes generated by GitHub, by label: every pull request needs one of them,
# see workflows/pr-labels.yml.
changelog:
  categories:
    - title: Layer
      labels:
        - 'release:layer'
    - title: Features
      labels:
        - 'release:feature'
    - title: Fixes
      labels:
        - 'release:fix'
    - title: Internal changes
      labels:
        - 'release:internal'
    - title: Other changes
      labels:
        - '*'
